services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ksmile}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ksmile}
      POSTGRES_DB: ${POSTGRES_DB:-ksmile}
    volumes:
      - ksmile_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ksmile} -d ${POSTGRES_DB:-ksmile}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # En prod VPS : ne pas exposer 5432 publiquement sauf besoin
    # ports:
    #   - "5432:5432"

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
        AUTH_URL: ${AUTH_URL:-http://localhost:3000}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ksmile}:${POSTGRES_PASSWORD:-ksmile}@db:5432/${POSTGRES_DB:-ksmile}?schema=public
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST:-true}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      CLOUDINARY_FOLDER: ${CLOUDINARY_FOLDER:-ksmile}
      # true uniquement au 1er démarrage (crée admin + catalogue de base)
      RUN_SEED: ${RUN_SEED:-false}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  # Dump Postgres → Cloudinary (raw). Lancer via cron :
  # docker compose --profile backup run --rm backup node /app/backup.mjs
  backup:
    profiles: ["backup"]
    build:
      context: ./docker/backup
      dockerfile: Dockerfile
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ksmile}:${POSTGRES_PASSWORD:-ksmile}@db:5432/${POSTGRES_DB:-ksmile}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      CLOUDINARY_FOLDER: ${CLOUDINARY_FOLDER:-ksmile}
      CLOUDINARY_BACKUP_FOLDER: ${CLOUDINARY_BACKUP_FOLDER:-ksmile/backups}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      TZ: Africa/Douala

volumes:
  ksmile_pg:
