<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#14583c" />
    <title>Hors ligne · Ksmile</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: system-ui, -apple-system, sans-serif;
        background: #f7f7f7;
        color: #1a1a1a;
        text-align: center;
      }
      .card {
        max-width: 360px;
        background: #fff;
        border: 1px solid #e6e6e6;
        padding: 28px 22px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 1.35rem;
        color: #14583c;
      }
      p {
        margin: 0 0 18px;
        color: #5c5c5c;
        line-height: 1.45;
        font-size: 0.95rem;
      }
      button {
        border: 0;
        background: #14583c;
        color: #fff;
        font-weight: 700;
        padding: 12px 18px;
        border-radius: 8px;
        font-size: 0.95rem;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Vous êtes hors ligne</h1>
      <p>
        Ksmile a besoin d’une connexion pour afficher le catalogue. Vérifiez
        votre réseau puis réessayez.
      </p>
      <button type="button" onclick="location.reload()">Réessayer</button>
    </div>
  </body>
</html>
